<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Obras Avanzado</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <style>
        /* Ajuste para que armonice perfectamente con el diseño de Tailwind */
        .choices__inner {
            background-color: white !important;
            border-color: #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 4px 8px !important;
        }
        .choices__input {
            background-color: transparent !important;
        }
        .choices[data-type*=select-one] .choices__input {
            padding: 4px !important;
            margin-bottom: 0px !important;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-2xl">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Nuevo Registro de Obra</h1>
        
        <form id="formObra" class="space-y-5">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Obra</label>
                <input type="text" id="obra" required autocomplete="off" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Introduce el nombre de la obra...">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Cliente</label>
                    <select id="Cliente" required class="w-full">
                        <option value="">Cargando clientes...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
                    <input type="date" id="Fecha" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Origen</label>
                    <select id="Origen" required class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option value="">Cargando orígenes...</option>
                    </select>
                    <input type="text" id="NuevoOrigen" placeholder="Escribe el nuevo origen..." class="hidden mt-2 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Producto</label>
                    <input type="text" id="Producto" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Introduce el producto...">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">m²</label>
                    <input type="number" id="m2" step="0.01" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Valor (€)</label>
                    <input type="number" id="Valor" step="0.01" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">¿Éxito?</label>
                    <select id="Éxito" required class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option value="Pendiente">Pendiente</option>
                        <option value="Sí">Sí (Ganada)</option>
                        <option value="No">No (Perdida)</option>
                    </select>
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" id="btnGuardar" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 px-4 rounded-md transition duration-200">
                    Guardar Registro
                </button>
            </div>
        </form>
    </div>

    <script>
        // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxsiqmB2181kAbKfVp0JXLt9tyKm7VuU9H_pauTw6d1vAq3h-AFQgbPOww9tobfUffj/exec";
        
        let choicesClienteInstance = null;

        function establecerFechaHoy() {
            const hoy = new Date();
            document.getElementById('Fecha').value = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;
        }

        function cargarDatosDinamicos() {
            const selectOrigen = document.getElementById('Origen');
            const selectCliente = document.getElementById('Cliente');
            
            fetch(URL_SCRIPT)
            .then(response => response.json())
            .then(data => {
                // 1. Rellenar orígenes
                selectOrigen.innerHTML = '<option value="">Selecciona una opción...</option>';
                data.origenes.forEach(origen => {
                    const option = document.createElement('option');
                    option.value = origen; option.textContent = origen;
                    selectOrigen.appendChild(option);
                });
                const optionNuevo = document.createElement('option');
                optionNuevo.value = "__NUEVO__"; optionNuevo.textContent = "+ Añadir nuevo origen...";
                selectOrigen.appendChild(optionNuevo);

                // 2. Rellenar clientes
                if (choicesClienteInstance) {
                    choicesClienteInstance.destroy();
                }

                selectCliente.innerHTML = '<option value="">Escribe para buscar o añadir nuevo...</option>';
                data.clientes.forEach(cliente => {
                    const option = document.createElement('option');
                    option.value = cliente;
                    option.textContent = cliente;
                    selectCliente.appendChild(option);
                });

                choicesClienteInstance = new Choices(selectCliente, {
                    searchEnabled: true,
                    addItems: true,
                    addItemFilter: null,
                    removeItemButton: false,
                    noResultsText: 'No se encuentra. Pulsa Enter para añadirlo como nuevo',
                    noChoicesText: 'Sin clientes guardados',
                    itemSelectText: 'Presiona para seleccionar',
                    addChoices: true 
                });
            })
            .catch(error => {
                console.error("Error cargando datos dinámicos:", error);
                selectOrigen.innerHTML = '<option value="">Selecciona una opción...</option><option value="Web">Web</option><option value="Recomendación">Recomendación</option><option value="Comercial">Contacto Comercial</option>';
            });
        }

        document.getElementById('Origen').addEventListener('change', function() {
            const campoNuevo = document.getElementById('NuevoOrigen');
            if (this.value === "__NUEVO__") {
                campoNuevo.classList.remove('hidden'); campoNuevo.required = true;
            } else {
                campoNuevo.classList.add('hidden'); campoNuevo.required = false;
            }
        });

        establecerFechaHoy();
        cargarDatosDinamicos();

        // ENVÍO DE DATOS
        document.getElementById('formObra').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const boton = document.getElementById('btnGuardar');
            boton.disabled = true;
            boton.innerText = "Guardando...";

            let origenSeleccionado = document.getElementById('Origen').value;
            if (origenSeleccionado === "__NUEVO__") {
                origenSeleccionado = document.getElementById('NuevoOrigen').value.trim();
            }

            const datos = {
                // Indicamos la pestaña fija de destino de forma interna
                Destino: "Obras_2026", 
                obra: document.getElementById('obra').value.trim(),
                Cliente: document.getElementById('Cliente').value.trim(),
                Fecha: document.getElementById('Fecha').value,
                Origen: origenSeleccionado,
                Producto: document.getElementById('Producto').value.trim(),
                m2: document.getElementById('m2').value,
                Valor: document.getElementById('Valor').value,
                Éxito: document.getElementById('Éxito').value
            };

            fetch(URL_SCRIPT, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            })
            .then(() => {
                alert('¡Registro guardado con éxito!');
                document.getElementById('formObra').reset();
                establecerFechaHoy();
                document.getElementById('NuevoOrigen').classList.add('hidden');
                cargarDatosDinamicos();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Hubo un error al guardar los datos.');
            })
            .finally(() => {
                boton.disabled = false;
                boton.innerText = "Guardar Registro";
            });
        });
    </script>
</body>
</html>
