<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Obras Móvil</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between antialiased">

    <header class="bg-white shadow-sm w-full px-4 py-3 flex items-center justify-between border-b border-gray-200 sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <span class="flex h-2 w-2 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
            </span>
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Nueva Obra</span>
        </div>
        
        <button id="btnSalir" class="flex items-center space-x-1 text-red-600 bg-red-50 hover:bg-red-100 font-medium text-xs px-3 py-1.5 rounded-md border border-red-100 transition duration-150 cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
            </svg>
            <span>Salir</span>
        </button>
    </header>

    <main class="flex-grow w-full max-w-md mx-auto p-3 sm:p-4 flex items-center justify-center">
        <div class="bg-white p-5 rounded-xl shadow-sm w-full border border-gray-200">
            
            <form id="formObra" class="space-y-4">

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wide mb-1">Obra</label>
                    <input type="text" id="obra" required autocomplete="off" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50/50" placeholder="Nombre o ref. de la obra">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wide mb-1">Cliente</label>
                    <input type="text" id="Cliente" list="listaClientes" required autocomplete="off" placeholder="Busca o escribe nuevo cliente" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50/50">
                    <datalist id="listaClientes">
                        </datalist>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wide mb-1">Fecha</label>
                    <input type="date" id="Fecha" required class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50/50">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wide mb-1">Origen</label>
                        <select id="Origen" required class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-base bg-white focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50/50">
                            <option value="">Cargando...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wide mb-1">Producto</label>
                        <input type="text" id="Producto" required autocomplete="off" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50/50" placeholder="Tipo de producto">
                    </div>
                </div>

                <input type="text" id="NuevoOrigen" placeholder="Escribe el nuevo origen..." class="hidden w-full px-3 py-2.5 border border-gray-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-green-500 bg-yellow-50/50">

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wide mb-1">m²</label>
                        <input type="number" id="m2" step="0.01" inputmode="decimal" required class="w-full px-2 py-2.5 border border-gray-300 rounded-lg text-base text-center focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50/50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wide mb-1">Valor (€)</label>
                        <input type="number" id="Valor" step="0.01" inputmode="decimal" required class="w-full px-2 py-2.5 border border-gray-300 rounded-lg text-base text-center focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50/50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wide mb-1">¿Éxito?</label>
                        <select id="Éxito" required class="w-full px-2 py-2.5 border border-gray-300 rounded-lg text-base bg-white focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50/50">
                            <option value="Pendiente">Pend.</option>
                            <option value="Sí">Ganada</option>
                            <option value="No">Perdida</option>
                        </select>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" id="btnGuardar" class="w-full bg-green-600 hover:bg-green-700 active:bg-green-800 text-white font-bold py-3 px-4 rounded-lg text-base shadow-sm transition duration-150 cursor-pointer">
                        Guardar Registro
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="text-center py-3 text-[10px] text-gray-400 font-medium tracking-wider uppercase">
        Enlace directo a Google Sheets
    </footer>

    <script>
        // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxsiqmB2181kAbKfVp0JXLt9tyKm7VuU9H_pauTw6d1vAq3h-AFQgbPOww9tobfUffj/exec";

        function establecerFechaHoy() {
            const hoy = new Date();
            document.getElementById('Fecha').value = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;
        }

        function cargarDatosDinamicos() {
            const selectOrigen = document.getElementById('Origen');
            const datalistClientes = document.getElementById('listaClientes');
            
            fetch(URL_SCRIPT)
            .then(response => response.json())
            .then(data => {
                // Rellenar orígenes
                selectOrigen.innerHTML = '<option value="">Origen...</option>';
                data.origenes.forEach(origen => {
                    const option = document.createElement('option');
                    option.value = origen; option.textContent = origen;
                    selectOrigen.appendChild(option);
                });
                const optionNuevo = document.createElement('option');
                optionNuevo.value = "__NUEVO__"; optionNuevo.textContent = "+ Nuevo origen...";
                selectOrigen.appendChild(optionNuevo);

                // Rellenar clientes de forma nativa en el datalist
                datalistClientes.innerHTML = '';
                data.clientes.forEach(cliente => {
                    const option = document.createElement('option');
                    option.value = cliente;
                    datalistClientes.appendChild(option);
                });
            })
            .catch(error => {
                console.error("Error cargando datos:", error);
                selectOrigen.innerHTML = '<option value="">Origen...</option><option value="Web">Web</option><option value="Recomendación">Recomendación</option><option value="Comercial">Comercial</option>';
            });
        }

        document.getElementById('Origen').addEventListener('change', function() {
            const campoNuevo = document.getElementById('NuevoOrigen');
            if (this.value === "__NUEVO__") {
                campoNuevo.classList.remove('hidden'); campoNuevo.required = true;
                campoNuevo.focus();
            } else {
                campoNuevo.classList.add('hidden'); campoNuevo.required = false;
            }
        });

        // CONTROL DEL BOTÓN SALIR
        document.getElementById('btnSalir').addEventListener('click', function() {
            if (confirm("¿Cerrar la aplicación?")) {
                window.close();
                window.location.href = "about:blank";
            }
        });

        establecerFechaHoy();
        cargarDatosDinamicos();

        // ENVÍO DE DATOS
        document.getElementById('formObra').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const boton = document.getElementById('btnGuardar');
            boton.disabled = true;
            boton.innerText = "Guardando...";

            let origenSeleccionado = document.getElementById('Origen').value;
            if (origenSeleccionado === "__NUEVO__") {
                origenSeleccionado = document.getElementById('NuevoOrigen').value.trim();
            }

            const datos = {
                Destino: "Obras", 
                obra: document.getElementById('obra').value.trim(),
                Cliente: document.getElementById('Cliente').value.trim(),
                Fecha: document.getElementById('Fecha').value,
                Origen: origenSeleccionado,
                Producto: document.getElementById('Producto').value.trim(),
                m2: document.getElementById('m2').value,
                Valor: document.getElementById('Valor').value,
                Éxito: document.getElementById('Éxito').value
            };

            fetch(URL_SCRIPT, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            })
            .then(() => {
                alert('¡Registro guardado con éxito!');
                document.getElementById('formObra').reset();
                establecerFechaHoy();
                document.getElementById('NuevoOrigen').classList.add('hidden');
                cargarDatosDinamicos();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Hubo un error al guardar.');
            })
            .finally(() => {
                boton.disabled = false;
                boton.innerText = "Guardar Registro";
            });
        });
    </script>
</body>
</html>
